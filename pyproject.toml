[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "factgraph"
version = "0.18.0"
description = "Semantic portability auditor with executable transformation-conformance evidence"
requires-python = ">=3.11"
authors = [{name = "OpenAI implementation"}]
dependencies = []

[project.optional-dependencies]
conformance = [
  "psycopg[binary]>=3.2,<4",
  "pymongo>=4.10,<5",
]
signing = [
  "cryptography>=43,<47",
]
interchange = [
  "PyYAML>=6,<7",
]
typedb = [
  "typedb-driver>=3.12,<4",
]
live = [
  "psycopg[binary]>=3.2,<4",
  "pymongo>=4.10,<5",
  "typedb-driver>=3.12,<4",
]

[project.scripts]
factgraph = "factgraph.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-rfE"
[tool.setuptools.package-data]
factgraph = ["data/*.fg", "data/metamodel/*.fg"]
